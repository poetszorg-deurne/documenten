<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smile momenten aan de waslijn — Poetszorg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Lexend:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  :root{
    --lucht-1:#7FBFEC;
    --lucht-2:#B9DFF7;
    --lucht-3:#DDEFFB;
    --inkt:#1C4E80;
    --geel:#FAF3A0;
  }

  html{-webkit-text-size-adjust:100%}

  body{
    font-family:"Lexend",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--inkt);
    background:linear-gradient(180deg,var(--lucht-1) 0%,var(--lucht-2) 42%,var(--lucht-3) 100%);
    background-attachment:fixed;
    min-height:100vh;
    padding-bottom:56px;
    overflow-x:hidden;
  }

  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(46vw 26vw at 8% 14%,rgba(255,255,255,.55),transparent 62%),
      radial-gradient(38vw 20vw at 88% 32%,rgba(255,255,255,.42),transparent 64%),
      radial-gradient(52vw 24vw at 28% 72%,rgba(255,255,255,.34),transparent 66%),
      radial-gradient(30vw 18vw at 74% 94%,rgba(255,255,255,.30),transparent 66%);
  }

  .wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 clamp(10px,3vw,28px)}

  /* ---------- kop ---------- */
  header{padding:clamp(26px,5vw,56px) 0 clamp(10px,2vw,24px);text-align:center;position:relative}

  .logo{width:clamp(170px,34vw,270px);height:auto;display:block;margin:0 auto}

  h1{
    font-weight:700;
    font-size:clamp(29px,7.4vw,56px);
    letter-spacing:.02em;
    text-transform:uppercase;
    margin-top:clamp(24px,5vw,46px);
    line-height:1.04;
  }
  .subkop{font-family:"Caveat",cursive;font-size:clamp(22px,4.8vw,36px);margin-top:0}

  .smiley{position:absolute;width:clamp(42px,8vw,84px);height:auto}
  .smiley.links{left:clamp(2px,5vw,110px);top:clamp(72px,15vw,166px);transform:rotate(-8deg)}
  .smiley.rechts{right:clamp(2px,5vw,110px);top:clamp(52px,11vw,116px);transform:rotate(7deg)}

  @media (max-width:1023px){
    .smiley{width:clamp(44px,6vw,58px)}
    .smiley.links{left:6px;top:20px}
    .smiley.rechts{right:6px;top:8px}
    h1{margin-top:clamp(26px,4vw,40px)}
  }

  .teller{margin-top:clamp(14px,2.6vw,22px);font-size:clamp(12px,1.6vw,14px);font-weight:500;opacity:.72}

  /* ---------- zoeken ---------- */
  .zoek{margin:clamp(12px,2.4vw,20px) auto 0;display:flex;gap:8px;align-items:center;max-width:420px}
  .zoek input{
    font:inherit;font-size:15px;font-weight:500;color:var(--inkt);
    flex:1;min-width:0;padding:11px 15px;border:0;border-radius:999px;
    background:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(19,74,124,.14);
  }
  .zoek input::placeholder{color:#6E90AF}
  .zoek input:focus-visible,.zoek button:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .zoek button{
    font:inherit;font-size:14px;font-weight:500;color:var(--inkt);
    padding:11px 16px;border:0;border-radius:999px;cursor:pointer;background:rgba(255,255,255,.55);
  }

  /* ---------- waslijnen ---------- */
  #bord{margin-top:clamp(22px,4vw,44px)}

  .lijn{position:relative;margin-bottom:var(--rij-gap,34px)}
  .lijn .touw{position:absolute;pointer-events:none;user-select:none}

  .briefje{
    position:absolute;
    background:#fff;
    box-shadow:0 8px 18px rgba(19,74,124,.20), 0 1px 2px rgba(19,74,124,.16);
    padding:var(--pad,18px) var(--pad,18px) 14px;
    display:flex;flex-direction:column;justify-content:center;text-align:center;
  }
  .briefje.geel{background:var(--geel)}
  .briefje.hoek::after{
    content:"";position:absolute;right:0;bottom:0;width:22px;height:22px;
    background:linear-gradient(315deg,rgba(19,74,124,.15) 0 48%,rgba(255,255,255,.92) 52% 100%);
  }

  .briefje p{
    font-family:"Caveat",cursive;font-weight:500;
    font-size:var(--tekst,17px);line-height:1.34;color:#1B3A57;overflow-wrap:break-word;
  }
  .briefje cite{
    font-family:"Caveat",cursive;font-style:normal;
    font-size:var(--naam,14px);color:#3E6382;margin-top:9px;
  }

  .knijper{position:absolute;left:50%;height:var(--knijper-h,40px);width:auto;transform:translateX(-50%)}

  /* ---------- uitvergroot briefje ---------- */
  .briefje{cursor:zoom-in}
  .briefje:focus-visible{outline:3px solid #fff;outline-offset:4px}

  .laag{
    position:fixed;inset:0;z-index:50;display:none;
    align-items:center;justify-content:center;
    padding:clamp(16px,5vw,48px);
    background:rgba(16,58,96,.62);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  }
  .laag.open{display:flex}

  .groot{
    position:relative;
    width:min(90vw,460px);
    min-height:min(90vw,460px);
    background:#fff;
    padding:clamp(28px,6vw,46px) clamp(24px,5vw,40px) clamp(24px,5vw,36px);
    display:flex;flex-direction:column;justify-content:center;text-align:center;
    box-shadow:0 24px 50px rgba(10,40,70,.42);
    transform:rotate(-1deg);
  }
  .groot.geel{background:var(--geel)}
  .groot .inhoud{max-height:64vh;overflow-y:auto}
  .groot .knijper{height:clamp(56px,11vw,74px);top:calc(-1 * clamp(56px,11vw,74px) + 14px)}
  .groot p{
    font-family:"Caveat",cursive;font-weight:500;
    font-size:clamp(24px,5.2vw,34px);line-height:1.34;color:#1B3A57;overflow-wrap:break-word;
  }
  .groot cite{
    font-family:"Caveat",cursive;font-style:normal;
    font-size:clamp(18px,3.6vw,23px);color:#3E6382;margin-top:16px;display:block;
  }

  .laag button{
    position:absolute;border:0;cursor:pointer;color:var(--inkt);
    background:rgba(255,255,255,.92);border-radius:999px;
    box-shadow:0 4px 12px rgba(10,40,70,.3);
    display:flex;align-items:center;justify-content:center;
  }
  .laag button:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .sluit{top:max(14px,env(safe-area-inset-top));right:14px;width:46px;height:46px;font-size:26px;line-height:1}
  .vorige,.volgende{top:50%;transform:translateY(-50%);width:48px;height:48px;font-size:26px;line-height:1;padding-bottom:4px}
  .vorige{left:max(8px,calc(50vw - 300px))}
  .volgende{right:max(8px,calc(50vw - 300px))}
  .laag .positie{
    position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:0;right:0;
    text-align:center;color:#fff;font-size:13px;font-weight:500;text-shadow:0 1px 4px rgba(10,40,70,.5);
  }

  @media (max-width:559px){
    .vorige{left:6px} .volgende{right:6px}
    .vorige,.volgende{top:auto;bottom:52px;transform:none}
  }

  .leeg{text-align:center;font-size:15px;font-weight:500;padding:40px 0;opacity:.8}

  footer{position:relative;z-index:1;text-align:center;font-size:12px;opacity:.55;margin-top:clamp(26px,5vw,52px)}

  @media (prefers-reduced-motion:no-preference){
    #bord{animation:opkomst .45s ease-out both}
    @keyframes opkomst{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  }
</style>
</head>

let open = -1;        // welk briefje is uitvergroot

const bord = document.getElementById('bord');
const teller = document.getElementById('teller');
const zoekveld = document.getElementById('zoekveld');

/* Kolommen en formaten per schermbreedte.
   Mobiel: 1 briefje per lijn, zo groot mogelijk, en een breed uitgesneden
   stuk touw zodat de lijn dik en de doorzak rustig blijft. */
function opzet(b){
  if (b < 560)  return {kolommen:1, breedte:Math.min(b*0.80,290), hoogte:0.78, spreiding:2.4, knijper:58, tekst:19, naam:16, pad:20, gap:20};
  if (b < 820)  return {kolommen:2, breedte:Math.min((b-56)/2,250), hoogte:0.92, spreiding:1.35, knijper:60, tekst:18, naam:15, pad:18, gap:26};
  if (b < 1060) return {kolommen:3, breedte:225, hoogte:1, spreiding:1.1, knijper:62, tekst:17, naam:14, pad:18, gap:30};
  return              {kolommen:5, breedte:200, hoogte:1, spreiding:1.0, knijper:66, tekst:16, naam:13, pad:16, gap:34};
}

function curveY(t){                       // t = 0..1 over de breedte van het touw
  const x = Math.min(1, Math.max(0, t)) * (CURVE.length - 1);
  const i = Math.floor(x), f = x - i;
  return i >= CURVE.length - 1 ? CURVE[CURVE.length - 1] : CURVE[i] * (1 - f) + CURVE[i + 1] * f;
}

function veilig(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render(){
  const zoek = zoekveld.value.trim().toLowerCase();
  const lijst = zoek
    ? MOMENTEN.filter(m => (m.tekst + ' ' + m.naam + ' ' + m.plaats).toLowerCase().includes(zoek))
    : MOMENTEN;

  teller.textContent = zoek
    ? lijst.length + ' van ' + MOMENTEN.length + ' smile momenten'
    : MOMENTEN.length + ' smile momenten';

  zichtbaar = lijst;
  bord.innerHTML = '';
  if (!lijst.length){
    bord.innerHTML = '<p class="leeg">Geen smile moment gevonden. Probeer een andere naam of plaats.</p>';
    return;
  }

  const rijBreedte = bord.clientWidth;
  const o = opzet(rijBreedte);
  bord.style.setProperty('--rij-gap', o.gap + 'px');

  const touwBreedte = rijBreedte * o.spreiding;
  const touwHoogte  = touwBreedte * TOUW_RATIO;
  const touwLinks   = (rijBreedte - touwBreedte) / 2;

  // hoogste punt van het zichtbare stuk touw, om lege ruimte boven de lijn weg te halen
  let top = 1;
  for (let s = 0; s <= 40; s++){
    const t = (-touwLinks + (s / 40) * rijBreedte) / touwBreedte;
    top = Math.min(top, curveY(t));
  }
  const touwTop = -top * touwHoogte + 4;

  for (let start = 0; start < lijst.length; start += o.kolommen){
    const rij = lijst.slice(start, start + o.kolommen);
    const lijn = document.createElement('div');
    lijn.className = 'lijn';

    const touw = document.createElement('img');
    touw.className = 'touw';
    touw.src = TOUW;
    touw.alt = '';
    touw.setAttribute('aria-hidden','true');
    touw.style.cssText = 'width:' + touwBreedte + 'px;height:' + touwHoogte + 'px;left:' + touwLinks + 'px;top:' + touwTop + 'px;';
    lijn.appendChild(touw);

    rij.forEach((m, i) => {
      const index = start + i;
      const t = o.kolommen === 1
        ? 0.5 + (index % 2 ? 0.03 : -0.03)                  // lichte slinger om het midden
        : (i + 0.5) / o.kolommen;                           // vaste plek op de lijn
      const y = curveY((t * rijBreedte - touwLinks) / touwBreedte) * touwHoogte + touwTop;
      const draai = ((index % 5) - 2) * 1.1;                // lichte, wisselende slinger

      const briefje = document.createElement('article');
      briefje.tabIndex = 0;
      briefje.setAttribute('role','button');
      briefje.setAttribute('aria-label','Lees dit smile moment groter');
      briefje.dataset.index = index;
      briefje.className = 'briefje' + (index % 2 ? ' geel' : '') + (index % 4 === 1 ? ' hoek' : '');
      briefje.style.cssText =
        'left:' + (t * 100) + '%;top:' + (y + o.knijper * 0.74 - 14) + 'px;' +
        'width:' + o.breedte + 'px;min-height:' + (o.breedte * o.hoogte) + 'px;' +
        'transform:translateX(-50%) rotate(' + draai + 'deg);' +
        '--tekst:' + o.tekst + 'px;--naam:' + o.naam + 'px;--pad:' + o.pad + 'px;--knijper-h:' + o.knijper + 'px;';

      const plaats = m.plaats ? (m.naam ? ', ' : '') + m.plaats : '';
      briefje.innerHTML =
        '<img class="knijper" src="' + KNIJPER + '" alt="" aria-hidden="true" style="top:' + (-o.knijper + 14) + 'px">' +
        '<p>' + veilig(m.tekst) + '</p>' +
        (m.naam || m.plaats ? '<cite>' + veilig(m.naam + plaats) + '</cite>' : '');

      lijn.appendChild(briefje);
    });

    bord.appendChild(lijn);

    // lijnhoogte = onderkant van het langste briefje, zodat lange teksten nooit overlappen
    let onder = 0;
    lijn.querySelectorAll('.briefje').forEach(el => { onder = Math.max(onder, el.offsetTop + el.offsetHeight); });
    lijn.style.height = onder + 'px';
  }
}

/* ---------- briefje uitvergroten ---------- */
const laag = document.getElementById('laag');
const groot = document.getElementById('groot');
const positie = document.getElementById('positie');
let vanwaar = null;

function toon(i){
  if (i < 0 || i >= zichtbaar.length) return;
  open = i;
  const m = zichtbaar[i];
  const plaats = m.plaats ? (m.naam ? ', ' : '') + m.plaats : '';
  groot.className = 'groot' + (i % 2 ? ' geel' : '');
  groot.innerHTML =
    '<img class="knijper" src="' + KNIJPER + '" alt="" aria-hidden="true">' +
    '<div class="inhoud"><p>' + veilig(m.tekst) + '</p>' +
    (m.naam || m.plaats ? '<cite>' + veilig(m.naam + plaats) + '</cite>' : '') + '</div>';
  groot.style.transform = 'rotate(' + (((i % 5) - 2) * 0.7) + 'deg)';
  groot.querySelector('.inhoud').scrollTop = 0;
  positie.textContent = (i + 1) + ' van ' + zichtbaar.length;
  document.getElementById('vorige').style.visibility = i > 0 ? 'visible' : 'hidden';
  document.getElementById('volgende').style.visibility = i < zichtbaar.length - 1 ? 'visible' : 'hidden';
  laag.classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('sluit').focus();
}

function sluiten(){
  laag.classList.remove('open');
  document.body.style.overflow = '';
  open = -1;
  if (vanwaar && document.contains(vanwaar)) vanwaar.focus();
}

bord.addEventListener('click', e => {
  const el = e.target.closest('.briefje');
  if (el){ vanwaar = el; toon(Number(el.dataset.index)); }
});
bord.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('.briefje');
  if (el){ e.preventDefault(); vanwaar = el; toon(Number(el.dataset.index)); }
});

document.getElementById('sluit').addEventListener('click', sluiten);
document.getElementById('vorige').addEventListener('click', () => toon(open - 1));
document.getElementById('volgende').addEventListener('click', () => toon(open + 1));
laag.addEventListener('click', e => { if (e.target === laag) sluiten(); });

addEventListener('keydown', e => {
  if (open < 0) return;
  if (e.key === 'Escape') sluiten();
  else if (e.key === 'ArrowLeft') toon(open - 1);
  else if (e.key === 'ArrowRight') toon(open + 1);
});

zoekveld.addEventListener('input', () => { if (open >= 0) sluiten(); render(); });
document.getElementById('wisser').addEventListener('click', () => { zoekveld.value = ''; render(); zoekveld.focus(); });

let wachten;
addEventListener('resize', () => { clearTimeout(wachten); wachten = setTimeout(render, 120); });
if (document.fonts) document.fonts.ready.then(render);
render();
</script>
</body>
</html>
